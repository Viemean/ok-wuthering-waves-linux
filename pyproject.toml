[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ok-wuthering-waves-linux"
version = "0.0.1"
description = "Wuthering Waves automation tool for Linux / Proton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "charset-normalizer",
    "darkdetect>=0.8.0",
    "idna",
    "numpy",
    "onnxocr-ppocrv5>=0.0.20",
    "opencv-python",
    "openvino",
    "openvino-telemetry",
    "pillow",
    "psutil>=6.0.0",
    "pyappify>=1.0.13",
    "pyclipper",
    "pynput>=1.8.2",
    "pyside6",
    "pyside6-fluent-widgets>=1.8.3",
    "requests>=2.32.3",
    "shapely",
    "six",
    "typing-extensions>=4.11.0",
    "urllib3",
    "onnxruntime",
    "evdev>=2.0.0",
    "pulsectl>=24.12.0",
    "python-xlib>=0.33",
    "mss>=10.2.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

