[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ok-wuthering-waves-linux"
version = "0.0.1"
description = "Wuthering Waves automation tool for Linux / Proton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.19",
    "charset-normalizer>=3.5.2",
    "darkdetect>=0.8.0",
    "idna>=3.20",
    "mcp==2.3.0",
    "numpy>=2.5.4",
    "onnxocr-ppocrv5>=0.0.22",
    "opencv-python>=5.0.0.93",
    "openvino>=2026.4.1",
    "openvino-telemetry>=2025.2.0",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pyappify>=1.0.13",
    "pyclipper>=1.4.0",
    "pynput>=1.8.2",
    "pyside6>=6.12.0",
    "pyside6-fluent-widgets>=1.11.3",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "six>=1.17.0",
    "typing-extensions>=4.16.0",
    "urllib3>=2.8.0",
    "onnxruntime>=1.31.0",
    "evdev>=2.0.0",
    "pulsectl>=24.12.0",
    "python-xlib>=0.33",
    "mss>=10.2.0",
]

[project.optional-dependencies]
mcp = [
    "mcp==2.3.0",
]
web-test = [
    "ok-script[web]==2.0.17",
]

[dependency-groups]
mcp = [
    "mcp==2.3.0",
]
dev = [
    "polib",
    "pytest>=9.1.1",
]
docs = [
    "mkdocs-material>=9.5,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

